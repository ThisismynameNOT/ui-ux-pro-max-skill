name: Gallery security hotfix validation

on:
  push:
    branches:
      - security/2026-10-nextjs-gallery
    paths:
      - gallery/package.json
      - gallery/package-lock.json
      - .github/workflows/gallery-security-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-lock-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Regenerate npm lockfile using patched versions
        working-directory: gallery
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        working-directory: gallery
        run: npm ci --no-audit --no-fund
      - name: Run gallery tests
        working-directory: gallery
        run: npm test
      - name: Build gallery
        working-directory: gallery
        run: npm run build
      - name: Commit regenerated lockfile
        if: success()
        run: |
          if ! git diff --quiet -- gallery/package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add gallery/package-lock.json
            git commit -m 'security(gallery): sync npm lockfile for patched Next.js'
            git push
          fi
