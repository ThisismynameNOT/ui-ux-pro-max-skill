name: Gallery security and build validation

on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - '.github/workflows/gallery-security-hotfix.yml'
  pull_request:
    paths:
      - 'gallery/**'
      - '.github/workflows/gallery-security-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: gallery/package-lock.json
      - name: Install locked dependencies
        working-directory: gallery
        run: npm ci --no-audit --no-fund
      - name: Run gallery tests
        working-directory: gallery
        run: npm test
      - name: Build gallery
        working-directory: gallery
        run: npm run build
      - name: Check critical runtime dependency advisories
        working-directory: gallery
        run: npm audit --omit=dev --audit-level=critical
